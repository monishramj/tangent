<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up Tangent</title>

<h1>Welcome to Tangent</h1>
<p>First setup downloads about <strong>2–3 GB</strong> of document and voice tools. Keep an internet connection while we prepare them.</p>
<p>You can cancel safely and resume later. Completed downloads will be reused.</p>

<p id="status" role="status" aria-live="polite">Ready to set up.</p>
