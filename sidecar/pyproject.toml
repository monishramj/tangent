[project]
name = "tangent-sidecar"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "docling>=2.60,<3",
    "pocket-tts==2.1.0",
    "numpy",
    "soundfile",
    "torch==2.15.0",
    "torchaudio==2.11.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: real model integration (PDF parsing or synthesis/alignment; may download weights)"]
